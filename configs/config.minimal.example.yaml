# 最小化部署样例：无 PostgreSQL，文件分析接口可用
# 复制为 config.yaml 或：server -config configs/config.minimal.example.yaml
# 环境变量：DATABASE_ENABLED=false 亦可

server:
  addr: ":18090"
  mode: debug

auth:
  api_keys:
    - "change-me-api-key"

database:
  enabled: false

llm:
  default_provider: deepseek
  timeout_seconds: 120
  providers:
    deepseek:
      base_url: "https://api.deepseek.com/v1"
      api_key: "" # 或 DEEPSEEK_API_KEY
      default_model: "deepseek-v4-flash"
    qwen:
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: ""
      default_model: "qwen-plus"
    kimi:
      base_url: "https://api.moonshot.cn/v1"
      api_key: ""
      default_model: "moonshot-v1-8k"

ocr:
  enabled: true
  languages: "chi_sim+eng"
  dpi: 200
  psm: 3

storage:
  attachments_dir: attachments

log:
  level: info
  encoding: json
  dir: logs

metrics:
  enabled: true
  path: /metrics
