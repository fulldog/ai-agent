# 宿主机配置模板：复制为 configs/config.yaml 后填写密钥（该文件已 gitignore，不会被 git pull 覆盖）
#   cp configs/config.docker.yaml configs/config.yaml
#
# Docker 默认把 configs/config.yaml 只读挂载到容器 /app/configs/config.yaml，进程直接读此文件。

server:
  addr: ":18090"
  mode: release

auth:
  api_keys:
    - "change-me-api-key"
  admin_api_keys:
    - "change-me-admin-key"

database:
  enabled: true
  # 内置库（脚本启动了 ai-agent-db）：主机名用 db
  # 复用宿主机已有 Postgres：用 host.docker.internal（容器访问宿主机 5432）
  #   dsn: "postgres://用户:密码@host.docker.internal:5432/ai_agent?sslmode=disable"
  dsn: "postgres://ai_agent:ai_agent_dev@db:5432/ai_agent?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5
  auto_migrate: true

llm:
  default_provider: deepseek
  provider: deepseek
  timeout_seconds: 120
  providers:
    deepseek:
      base_url: "https://api.deepseek.com/v1"
      api_key: ""   # 必填：DeepSeek Key
      default_model: "deepseek-v4-flash"
    qwen:
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: ""   # 必填（用 qwen 时）：通义 DashScope Key
      default_model: "qwen-plus"
    kimi:
      base_url: "https://api.moonshot.cn/v1"
      api_key: ""
      default_model: "moonshot-v1-8k"
    doubao:
      base_url: "https://ark.cn-beijing.volces.com/api/v3"
      api_key: ""
      default_model: ""

embed:
  # Docker Compose 内置 Ollama（同网络服务名）：http://ollama:11434/v1
  # 宿主机安装的 Ollama：http://host.docker.internal:11434/v1
  base_url: "http://ollama:11434/v1"
  api_key: ""
  model: "nomic-embed-text"
  dimensions: 768

rag:
  top_k: 5
  chunk_size: 800
  chunk_overlap: 120
  vector_index: hnsw

agent:
  max_steps: 8
  default_tools:
    - knowledge_search
    - current_time
    - calculator

ocr:
  enabled: true
  tesseract_path: tesseract
  languages: chi_sim+eng
  pdftoppm_path: pdftoppm
  pdftotext_path: pdftotext
  min_pdf_text_len: 40
  timeout_seconds: 180
  dpi: 200
  psm: 3
  oem: 3
  pdftoppm_gray: false
  collapse_cjk_spaces: true

storage:
  attachments_dir: attachments

extract:
  timeout_seconds: 180

log:
  level: info
  encoding: json
  body_preview_max: 4096
  dir: logs
  filename: ai-agent
  max_size_mb: 100
  max_backups: 30
  max_age_days: 30
  also_stdout: false

metrics:
  enabled: true
  path: /metrics
  protect: false

request_log:
  enabled: true
  persist_body: true
