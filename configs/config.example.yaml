# AI Agent 配置样例（复制为 config.yaml 后填写；勿提交真实密钥）
# 环境变量可覆盖：DEEPSEEK_API_KEY、DASHSCOPE_API_KEY、MOONSHOT_API_KEY、ARK_API_KEY、API_KEYS、
# DATABASE_URL / PG_DSN、DATABASE_ENABLED=false（最小化部署，不连库）、BIZ_DATABASE_URL（MySQL 业务库）、
# BIZ_SSH_ENABLED / BIZ_SSH_HOST / BIZ_SSH_USER / BIZ_SSH_PASSWORD（dbconn SSH 开关与用户名密码）

server:
  addr: ":18090"
  mode: debug # debug | release
  # CORS：留空或 ["*"] 允许所有来源；填写具体 Origin 则仅放行这些源
  cors_origins: []

auth:
  # 逗号分隔多个 key；也可用环境变量 API_KEYS
  api_keys:
    - "change-me-api-key"
  # 可选：具备查日志等管理能力的 key
  admin_api_keys:
    - "change-me-admin-key"

database:
  # false = 最小化部署：不连 PostgreSQL；/chat/analyze 仍可用（无缓存/会话落库）
  # 也可用环境变量 DATABASE_ENABLED=false；或清空 dsn 且不设 enabled
  enabled: true
  # 优先读环境变量 DATABASE_URL 或 PG_DSN
  dsn: "postgres://ai_agent:ai_agent_dev@10.0.10.42:5432/ai_agent?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5
  # 启动时 CREATE EXTENSION IF NOT EXISTS vector
  auto_migrate: true

llm:
  system_prompt: "回答简洁直接，不要套话，不要瞎编，必须要有依据。"
  # 默认厂商；请求未传 provider 时使用
  default_provider: qwen
  timeout_seconds: 120
  # 通义 Qwen3 等默认会思考；false 时请求带 enable_thinking=false。也可用 LLM_ENABLE_THINKING
  enable_thinking: false
  # 每次对话请求带入的最近历史消息条数（不含当前问题 / system）
  max_history: 10
  # 可选：覆盖默认「简洁作答」系统提示（钉钉/控制台对话）
  # system_prompt: "回答简洁直接，不要套话。"
  # 多厂商（OpenAI 兼容协议）。也可用环境变量注入 key：
  #   DEEPSEEK_API_KEY / DASHSCOPE_API_KEY|QWEN_API_KEY / MOONSHOT_API_KEY|KIMI_API_KEY / ARK_API_KEY|DOUBAO_API_KEY
  providers:
    deepseek:
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      default_model: "deepseek-v4-flash"
    qwen:
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: ""
      default_model: "qwen-plus"
    kimi:
      base_url: "https://api.moonshot.cn/v1"
      api_key: ""
      default_model: "moonshot-v1-8k"
    doubao:
      # 火山方舟 OpenAI 兼容；default_model 填接入点 ID（如 ep-xxxx）或模型名
      base_url: "https://ark.cn-beijing.volces.com/api/v3"
      api_key: ""
      default_model: ""

embed:
  # DeepSeek 无 Embedding；默认本地 Ollama OpenAI 兼容接口
  base_url: "http://10.0.10.42:11434/v1"
  api_key: ""
  model: "nomic-embed-text"
  dimensions: 768

rag:
  top_k: 5
  chunk_size: 800
  chunk_overlap: 120
  # pgvector 索引：none | ivfflat | hnsw（数据量小可 none，生产建议 hnsw）
  vector_index: hnsw
  # 余弦距离上限（越小越相似）。对话、Agent、RAG 调试页、钉钉检索超过该值视为未命中；0 表示不过滤
  max_distance: 0.55

agent:
  max_steps: 8
  default_tools:
    - knowledge_search
    - dbconn

# 普通对话（/chat/completions、钉钉）默认带 RAG + 工具（含 dbconn）。
# tools_enabled 为 false 时仍挂载 agent.default_tools，仅不再并入下方 tools。
# tools 与 agent.default_tools 合并（去重）；max_tool_steps 是一次对话内最多的工具轮数。
# 请求未传 rag 时默认检索；无 corpus_id 时搜全部语料库。
chat:
  tools_enabled: true
  rag_enabled: true
  tools: []
  max_tool_steps: 4

# 独立 MySQL 业务库（Agent dbconn 工具，只读查询）。勿填本服务 PostgreSQL。
# 也可用环境变量 BIZ_DATABASE_URL 覆盖 dsn。未填 dsn 则不注册该工具。
# DSN 中的 host:port 是 SSH 对端看到的 MySQL 地址（常见 127.0.0.1:3306）。
# SSH 用户名密码：BIZ_SSH_ENABLED / BIZ_SSH_HOST / BIZ_SSH_PORT / BIZ_SSH_USER / BIZ_SSH_PASSWORD
dbconn:
  enabled: true
  driver: mysql
  dsn: "root:Netjoy@123@tcp(10.0.10.43:3306)/crm?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&multiStatements=true" # 例: user:pass@tcp(127.0.0.1:3306)/biz?charset=utf8mb4&parseTime=true&loc=Local
  max_open_conns: 5
  max_idle_conns: 2
  max_rows: 50
  timeout_seconds: 15
  ssh:
    enabled: false     # true 走 SSH 隧道，false 直连 MySQL
    host: ""
    port: 22
    user: ""           # SSH 用户名
    password: ""       # SSH 密码（enabled 时必填）；也可用 BIZ_SSH_PASSWORD
    known_hosts_path: ""           # 空则尝试 ~/.ssh/known_hosts
    insecure_ignore_host_key: false  # 仅实验环境
    keepalive_seconds: 30
    reconnect_wait_seconds: 2

# 文档解析：pdf/docx 文本提取；图片与扫描版 PDF 走 OCR（需本机安装工具，Linux/Windows 均可）
ocr:
  enabled: true
  # Windows 建议写绝对路径，避免服务进程未继承用户 PATH
  tesseract_path: tesseract          # 例: C:\Program Files\Tesseract-OCR\tesseract.exe
  languages: chi_sim+eng             # 需 tessdata 含 chi_sim（见 docs/EXTRACT.md）
  pdftoppm_path: pdftoppm
  pdftotext_path: pdftotext          # 例: C:\Poppler\poppler-26.02.0\Library\bin\pdftotext.exe
  min_pdf_text_len: 40               # PDF 文本少于此长度时尝试 OCR
  timeout_seconds: 180
  dpi: 200                           # pdftoppm -r；默认 200。可试 300，有印章时未必更好
  psm: 3                             # tesseract --psm；3=全自动（推荐），6=均匀文本块（印章页慎用）
  oem: 3                             # tesseract --oem；3=默认 LSTM
  pdftoppm_gray: false               # true 时 pdftoppm -gray；默认 false（彩色）
  collapse_cjk_spaces: true          # 去掉汉字间多余空格（Tesseract 中文常见「一字一空」）

# 附件落盘：原始文件 + 抽取文本（按年月日分目录）
storage:
  attachments_dir: attachments

# 文档抽取（可选）：超时等；是否云端上传由请求的 provider 决定（qwen/kimi 云端，deepseek 本机）
extract:
  timeout_seconds: 180
  # fallback_local / backend 已废弃：请用 provider 选择能力

log:
  level: info # debug | info | warn | error
  # json | console
  encoding: json
  # 请求体/响应预览最大字符数
  body_preview_max: 4096
  # 分类日志目录：access / info（含 SQL）/ error / llm（完整 prompt/回复，llm_call_id=库表 id）
  dir: logs
  filename: ai-agent # 兼容旧配置，分类后文件名以 access|info|error|llm 为前缀
  max_size_mb: 100
  max_backups: 30
  max_age_days: 30
  # 省略时：debug 打 stdout+文件；release/pro/prod/production 只写文件、不 stdout
  # also_stdout: false

metrics:
  enabled: true
  path: /metrics
  # true 时 /metrics 需要 admin API Key
  protect: false

request_log:
  enabled: true
  # 是否把 request body 写入 PostgreSQL request_logs
  persist_body: true

# 钉钉 Stream 机器人。环境变量：DINGTALK_ENABLED、DINGTALK_CLIENT_ID、
# DINGTALK_CLIENT_SECRET、DINGTALK_CARD_TEMPLATE_ID、DINGTALK_REPLY_MODE、DINGTALK_REPLY_TAG
dingtalk:
  enabled: false
  client_id: ""         # 凭证与基础信息的 Client ID（旧称 AppKey）
  client_secret: ""     # 同一应用的 Client Secret
  card_template_id: ""  # 可选；留空则整段回复走 sessionWebhook
  reply_mode: web      # chat=CompleteStream（默认）；agent=钉钉预检索后 Agent.Run；web=与控制台 Agent 同一套 Run（不预注入 hits）
  # reply_tag: ""       # 出站末尾实例标记；留空默认本机 hostname
