# AI Agent 配置样例（复制为 config.yaml 后填写；勿提交真实密钥）
# 环境变量可覆盖：DEEPSEEK_API_KEY、API_KEYS、DATABASE_URL / PG_DSN

server:
  addr: ":18090"
  mode: debug # debug | release

auth:
  # 逗号分隔多个 key；也可用环境变量 API_KEYS
  api_keys:
    - "change-me-api-key"
  # 可选：具备查日志等管理能力的 key
  admin_api_keys:
    - "change-me-admin-key"

database:
  # 优先读环境变量 DATABASE_URL 或 PG_DSN
  dsn: "postgres://ai_agent:password@127.0.0.1:5432/ai_agent?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5
  # 启动时 CREATE EXTENSION IF NOT EXISTS vector
  auto_migrate: true

llm:
  provider: deepseek
  base_url: "https://api.deepseek.com/v1"
  # 务必用环境变量 DEEPSEEK_API_KEY，勿把真实 key 写入仓库
  api_key: ""
  default_model: "deepseek-v4-flash"
  timeout_seconds: 120

embed:
  # DeepSeek 无 Embedding；默认本地 Ollama OpenAI 兼容接口
  base_url: "http://localhost:11434/v1"
  api_key: ""
  model: "nomic-embed-text"
  dimensions: 768

rag:
  top_k: 5
  chunk_size: 800
  chunk_overlap: 120
  # pgvector 索引：none | ivfflat | hnsw（数据量小可 none，生产建议 hnsw）
  vector_index: hnsw

agent:
  max_steps: 8
  default_tools:
    - knowledge_search
    - current_time

log:
  level: info # debug | info | warn | error
  # json | console
  encoding: json
  # 请求体/响应预览最大字符数
  body_preview_max: 4096
  # 文件日志：项目工作目录下 logs/，按日命名，单文件超过 100MB 再切分
  dir: logs
  filename: ai-agent
  max_size_mb: 100
  max_backups: 30
  max_age_days: 30
  # 省略时：debug 打 stdout+文件；release（生产）只写文件、不 stdout
  # also_stdout: false

metrics:
  enabled: true
  path: /metrics
  # true 时 /metrics 需要 admin API Key
  protect: false

request_log:
  enabled: true
  # 是否把 request body 写入 PostgreSQL request_logs
  persist_body: true
