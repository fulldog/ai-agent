# 最小化：无库。同样挂载 configs/config.yaml（其中 database.enabled: false）
name: ai-agent-minimal

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.25.5"
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: ai-agent:local
    container_name: ai-agent-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18090}:18090"
    environment:
      TZ: Asia/Shanghai
      DATABASE_ENABLED: "false"
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
      - ./data/logs:/app/logs
      - ./data/attachments:/app/attachments
    networks:
      - ai-agent-net

networks:
  ai-agent-net:
    driver: bridge
