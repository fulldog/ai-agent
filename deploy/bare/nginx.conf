# ai-agent 控制台 + API 反代
# 用法（Debian/Ubuntu）：
#   1. npm run build 生成 web/dist
#   2. 把 root 改成实际 dist 路径
#   3. sudo cp deploy/bare/nginx.conf /etc/nginx/sites-available/ai-agent-web.conf
#   4. sudo ln -sfn /etc/nginx/sites-available/ai-agent-web.conf /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
# 访问：http://<服务器IP>:8080/  （API Base 留空，走同域 /api）
#
# 裸机脚本会按 nginx.conf.template 自动生成等价配置：
#   bash deploy/bare/deploy.sh

upstream ai_agent_api {
    server 127.0.0.1:18090;
    keepalive 16;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /opt/ai-agent/web/dist;
    index index.html;

    # 语料/文件分析 multipart 上传
    client_max_body_size 64m;
    client_body_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://ai_agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE：对话 / Agent / 文件分析 stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://ai_agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Prometheus；默认不对公网开放。需要时取消注释，并在后端 metrics.protect 配 admin key。
    # location /metrics {
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://ai_agent_api;
    # }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS 示例（有域名与证书时，把上面 listen 8080 改成仅内网，或删掉 default_server）：
