# 可选：Ollama Embedding（RAG）
# 与 docker-compose.yml 同项目名，叠加启动后与 app 共用 ai-agent-net。
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d ollama
#   docker exec -it ai-agent-ollama ollama pull nomic-embed-text
#
# app 的 configs/config.yaml：
#   embed.base_url: "http://ollama:11434/v1"
#
# 说明见 docs/DOCKER.md § Embedding / Ollama

name: ai-agent

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-agent-ollama
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 容器内监听；同网络用服务名 ollama 访问即可
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      # 宿主机调试用；仅 compose 内访问可不映射
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ai_agent_ollama:/root/.ollama
    networks:
      - ai-agent-net
    # 有 NVIDIA GPU 时取消下面注释（需已装 nvidia-container-toolkit）:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ai_agent_ollama:

networks:
  ai-agent-net:
    driver: bridge
