# 内置 PostgreSQL 16 + pgvector（仅当宿主机 5432 空闲时由脚本叠加）
name: ai-agent

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_agent_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai_agent_pgdata:/var/lib/postgresql/data
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ai-agent-net

  app:
    depends_on:
      db:
        condition: service_healthy

volumes:
  ai_agent_pgdata:

networks:
  ai-agent-net:
    driver: bridge
