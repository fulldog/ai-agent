# ai-agent 应用：配置文件挂载自宿主机 configs/config.yaml
# 用法见 docs/DOCKER.md

name: ai-agent

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.25.5"
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: ai-agent:local
    container_name: ai-agent-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18090}:18090"
    environment:
      TZ: Asia/Shanghai
      # 仅当部署脚本需要改写库地址时才会设置；空则完全使用挂载的 config.yaml
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-}
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
      - ./data/logs:/app/logs
      - ./data/attachments:/app/attachments
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-agent-net

networks:
  ai-agent-net:
    driver: bridge
