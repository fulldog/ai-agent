# ai-agent 应用服务（默认不启数据库）
# 数据库：见 docker-compose.db.yml；由 update-and-start.sh 按 5432 是否占用自动决定
#
#   cp deploy/docker/env.example .env
#   ./deploy/docker/update-and-start.sh

name: ai-agent

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.25.5"
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: ai-agent:local
    container_name: ai-agent-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18090}:18090"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:-postgres://ai_agent:ai_agent_dev@db:5432/ai_agent?sslmode=disable}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      API_KEYS: ${API_KEYS:-change-me-api-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_API_KEY: ${DASHSCOPE_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      KIMI_API_KEY: ${MOONSHOT_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      DOUBAO_API_KEY: ${ARK_API_KEY:-}
      GOPROXY: ${GOPROXY:-}
    volumes:
      - ./data/logs:/app/logs
      - ./data/attachments:/app/attachments
      # - ./configs/config.yaml:/app/configs/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-agent-net

networks:
  ai-agent-net:
    driver: bridge
